[build]
  ignore = 'git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- ":(top)PAGINA WEB ACT 070426" 2>/dev/null || exit 1'
  publish = "."
  functions = "netlify/functions"

# Cache static images safely while keeping HTML and scripts fresh.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
